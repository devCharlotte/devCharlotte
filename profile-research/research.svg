<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 882" width="2400" height="882" role="img"
 aria-labelledby="t d">
<title id="t">Memory-Efficient System Software</title>
<desc id="d">Left: system software for efficient computing, a system stack of applications, runtime and
libraries, the operating system (CPU, memory management, I/O stacks) and hardware (CPU, DRAM, SSD, NIC), with
memory-efficient software spanning OS memory management down to DRAM; outcomes: higher application performance,
less memory per workload. Right: Motivation: Despite surging memory demand, substantial capacity is wasted across the system stack. Goal: Detect and reclaim wasted memory without degrading application performance. How: Characterize memory waste and redesign OS mechanisms for low-overhead reclamation and efficient memory utilization.</desc>
